name: Daily AI traffic report

on:
  schedule:
    # GitHub queues scheduled jobs behind paid ones and has delayed this workflow by
    # 5 to 12 hours on free runners. So we ask several times, starting early, and the
    # first one that actually fires builds the report; the later ones find the day
    # already done and stop immediately. 05:00 UTC = 07:00 Brussels while CEST is in
    # force. After the DST change on 26 October, shift every line one hour later.
    - cron: "0 5 * * *"
    - cron: "30 5 * * *"
    - cron: "0 6 * * *"
    - cron: "30 6 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      asof:
        description: "Pretend the run happens on this date (YYYY-MM-DD)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Has today's report already been built?
        id: guard
        run: |
          today="AI traffic report $(date -u +%Y-%m-%d)"
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif git log -20 --format=%s | grep -Fxq "$today"; then
            echo "Already committed: $today. Stopping here."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Pull GA4 data
        if: steps.guard.outputs.skip != 'true'
        env:
          GA4_SA_JSON: ${{ secrets.GA4_SA_JSON }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID || '355017554' }}
        run: python scripts/pull.py ${{ github.event.inputs.asof && format('--asof {0}', github.event.inputs.asof) || '' }}

      - name: Build the report
        if: steps.guard.outputs.skip != 'true'
        run: python scripts/build_report.py ${{ github.event.inputs.asof && format('--asof {0}', github.event.inputs.asof) || '' }}

      - name: Commit data and report
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "ef-ai-traffic-bot"
          git config user.email "actions@github.com"
          git add data docs
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "AI traffic report $(date -u +%Y-%m-%d)"
            git push
          fi
